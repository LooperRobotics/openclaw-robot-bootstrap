services:
  ros-humble:
    image: ros:humble-ros-core
    container_name: ros-humble-core
    restart: unless-stopped
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
    volumes:
      - ros-state:/root/.ros
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && ros2 daemon stop; sleep infinity"]

  tailscale:
    image: tailscale/tailscale:latest
    container_name: openclaw-tailscale
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_HOSTNAME: ${TS_HOSTNAME:-openclaw-gateway}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-latest}
    container_name: openclaw-gateway
    restart: unless-stopped
    network_mode: service:tailscale
    env_file: .env
    depends_on:
      - tailscale
    environment:
      OPENCLAW_HOME: /root
      OPENCLAW_STATE_DIR: /root/.openclaw
      OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
      OPENCLAW_LOG_LEVEL: ${OPENCLAW_LOG_LEVEL:-info}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD}
      CLAWHUB_WORKDIR: /root/.openclaw/workspace
    volumes:
      - ${OPENCLAW_STATE_PATH:-./openclaw-state}:/root/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["openclaw", "gateway", "--port", "18789", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  tailscale-state:
  ros-state:
